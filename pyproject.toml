[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "options-market-making-simulator"
version = "0.1.0"
description = "Python research prototype for options valuation, quote construction, simplified execution, inventory accounting, P&L, and delta hedging"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0,<3.0",
    "scipy>=1.10,<2.0",
]

[project.optional-dependencies]
parquet = ["pyarrow>=14.0.1,<24"]

[tool.setuptools.packages.find]
where = ["src"]
