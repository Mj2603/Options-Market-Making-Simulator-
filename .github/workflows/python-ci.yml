name: Python CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Install package
        run: |
          pip install -e .
      - name: Collect environment info
        run: |
          python -V
          echo "\n--- PIP LIST ---"
          pip list
          echo "\n--- PIP SHOW options-mm / options_mm ---"
          pip show options-mm || pip show options_mm || true
          echo "\n--- WORKING DIR ---"
          ls -la
      - name: Run tests
        run: |
          pytest -vv | tee pytest.log
          echo $? > pytest_exit_code
      - name: Upload pytest logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-logs-${{ matrix.python-version }}
          path: |
            pytest.log
            pytest_exit_code
